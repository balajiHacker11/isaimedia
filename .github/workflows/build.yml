name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --console=plain --no-daemon 2>&1 | tee build.log

      - name: Show first errors
        if: failure()
        run: |
          grep -nE "^e: |What went wrong|Could not|error:|Unresolved|FAILED" build.log | head -40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IsaiPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
